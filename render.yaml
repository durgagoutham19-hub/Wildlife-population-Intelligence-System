services:
  # Unified Full-Stack Service (FastAPI + React SPA)
  - type: web
    name: wildlife-population-system
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "./render-build.sh"
    startCommand: "python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: NODE_VERSION
        value: 20.11.0
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRATION_HOURS
        value: "72"
      - key: ENVIRONMENT
        value: "production"
      - key: DATABASE_URL
        value: "sqlite:///wildlife.db"
